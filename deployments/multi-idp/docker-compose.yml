# Multi-IdP development stack.
#
# Runs the OAD API alongside two real Identity Providers:
#
#   - Keycloak — OIDC for the management plane (issues JWTs that
#     authenticate users into OAD).
#   - Authentik — second IdP that demonstrates SCIM ingest. Authentik
#     also issues OIDC tokens, replacing the Dex+glauth pair the stack
#     used before B.7 (see docs/design/scim-ingest.md §11/§12.1).
#
# Authentik provisions its bootstrapped Users and Groups into OAD via
# its SCIM Provider on first start. The SCIM bearer token is shared
# between Authentik and OAD via the env vars AUTHENTIK_OAD_SCIM_TOKEN
# and OAD_SCIM_TOKEN_AUTHENTIK respectively (set them to the same
# value — see .env.example).

services:
  api:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: dev
    ports:
      - "8080:8080"
    environment:
      OAD_DATABASE: "postgresql://oad:oad@postgres:5432/oad?sslmode=disable"
      OAD_SCIM_TOKEN_AUTHENTIK: "${OAD_SCIM_TOKEN_AUTHENTIK:?set OAD_SCIM_TOKEN_AUTHENTIK in .env}"
    volumes:
      - ./config.yml:/etc/oad/config.yml:ro
    command: ["run", "server", "--config", "/etc/oad/config.yml"]
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      authentik-server:
        condition: service_healthy
    restart: on-failure

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.0
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
      - keycloak_data:/opt/keycloak/data
    command:
      - start-dev
      - --import-realm
    healthcheck:
      test: ["CMD", "bash", "-c", "{ exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /realms/oad/.well-known/openid-configuration HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '200 OK' <&3; } 2>/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: oad
      POSTGRES_PASSWORD: oad
      POSTGRES_DB: oad
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oad -d oad"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ──────────────────────────────────────────────────────────────────────
  # Authentik
  #
  # Authentik runs as four cooperating containers (server + worker +
  # redis + postgres). The custom blueprint mounted at
  # /blueprints/custom/oad.yaml is applied on first start and seeds the
  # Users / Groups / Application / OIDC Provider / SCIM Provider that
  # the OAD demo expects.
  # ──────────────────────────────────────────────────────────────────────

  authentik-postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: authentik
      POSTGRES_DB: authentik
    volumes:
      - authentik_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authentik -d authentik"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  authentik-redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - authentik_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  authentik-server:
    image: ghcr.io/goauthentik/server:2024.10.5
    command: server
    environment:
      AUTHENTIK_SECRET_KEY: "${AUTHENTIK_SECRET_KEY:?set AUTHENTIK_SECRET_KEY in .env}"
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgres
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_BOOTSTRAP_PASSWORD: "${AUTHENTIK_BOOTSTRAP_PASSWORD:-akadmin}"
      AUTHENTIK_BOOTSTRAP_TOKEN: "${AUTHENTIK_BOOTSTRAP_TOKEN:-}"
      AUTHENTIK_OAD_SCIM_TOKEN: "${AUTHENTIK_OAD_SCIM_TOKEN:?set AUTHENTIK_OAD_SCIM_TOKEN in .env}"
      AUTHENTIK_BOOTSTRAP_USER_PW_ADMIN: "${AUTHENTIK_BOOTSTRAP_USER_PW_ADMIN:-admin}"
      AUTHENTIK_BOOTSTRAP_USER_PW_EDITOR: "${AUTHENTIK_BOOTSTRAP_USER_PW_EDITOR:-editor}"
      AUTHENTIK_BOOTSTRAP_USER_PW_VIEWER: "${AUTHENTIK_BOOTSTRAP_USER_PW_VIEWER:-viewer}"
      AUTHENTIK_BOOTSTRAP_USER_PW_PDP: "${AUTHENTIK_BOOTSTRAP_USER_PW_PDP:-pdp}"
    volumes:
      - ./authentik/blueprints:/blueprints/custom:ro
      - authentik_media:/media
    ports:
      - "9000:9000"
    depends_on:
      authentik-postgres:
        condition: service_healthy
      authentik-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  authentik-worker:
    image: ghcr.io/goauthentik/server:2024.10.5
    command: worker
    environment:
      AUTHENTIK_SECRET_KEY: "${AUTHENTIK_SECRET_KEY:?set AUTHENTIK_SECRET_KEY in .env}"
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgres
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_OAD_SCIM_TOKEN: "${AUTHENTIK_OAD_SCIM_TOKEN:?set AUTHENTIK_OAD_SCIM_TOKEN in .env}"
      AUTHENTIK_BOOTSTRAP_USER_PW_ADMIN: "${AUTHENTIK_BOOTSTRAP_USER_PW_ADMIN:-admin}"
      AUTHENTIK_BOOTSTRAP_USER_PW_EDITOR: "${AUTHENTIK_BOOTSTRAP_USER_PW_EDITOR:-editor}"
      AUTHENTIK_BOOTSTRAP_USER_PW_VIEWER: "${AUTHENTIK_BOOTSTRAP_USER_PW_VIEWER:-viewer}"
      AUTHENTIK_BOOTSTRAP_USER_PW_PDP: "${AUTHENTIK_BOOTSTRAP_USER_PW_PDP:-pdp}"
    volumes:
      - ./authentik/blueprints:/blueprints/custom:ro
      - authentik_media:/media
    depends_on:
      authentik-postgres:
        condition: service_healthy
      authentik-redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  keycloak_data:
  authentik_postgres_data:
  authentik_redis_data:
  authentik_media:
