# OAD runtime configuration for the multi-idp deployment stack.
# Mounted read-only into the api container at /etc/oad/config.yml.
# The api service passes --config /etc/oad/config.yml to the binary.
#
# Two providers are registered:
#
#   - keycloak  — primary OIDC IdP for the management plane.
#   - authentik — second OIDC IdP that ALSO acts as the SCIM source.
#                 SCIM token is shared with Authentik via the env var
#                 OAD_SCIM_TOKEN_AUTHENTIK (see .env.example).

auth:
  mode: jwt
  providers:
    - name: keycloak
      display_name: Keycloak
      backend:
        # Internal Docker network URL — reachable from the api container.
        jwks_url: http://keycloak:8080/realms/oad/protocol/openid-connect/certs
        # Must match the iss claim in tokens; tokens are minted for the
        # external URL (http://localhost:8081) that the browser uses.
        issuer: http://localhost:8081/realms/oad
        audience: oad-api
        # Keycloak emits native oad_roles and oad_system_id claims via realm
        # mappers — no claims_mapping override required.
      webui:
        # External URL — used by the browser OIDC client.
        authority: http://localhost:8081/realms/oad
        client_id: oad-web
        scope: openid profile email

    - name: authentik
      display_name: Authentik
      backend:
        # Internal Docker network URL — reachable from the api container.
        # Authentik exposes per-application JWKS at /application/o/<slug>/jwks/.
        jwks_url: http://authentik-server:9000/application/o/oad/jwks/
        # Must match the `iss` claim. Authentik mints tokens with the
        # external issuer URL when issuer_mode=per_provider in the
        # blueprint's OAuth2Provider entry.
        issuer: http://localhost:9000/application/o/oad/
        # Authentik sets aud to the requesting client_id for public clients.
        audience: oad-web-authentik
        # roles and system access are resolved from the entity/relation graph —
        # claims_mapping is no longer supported and will be rejected at startup.
      webui:
        # External URL — used by the browser OIDC client.
        authority: http://localhost:9000/application/o/oad/
        client_id: oad-web-authentik
        scope: openid profile email
      scim:
        enabled: true
        # Shared with Authentik via AUTHENTIK_OAD_SCIM_TOKEN. Both env
        # vars must hold the same value (see .env.example).
        token: env:OAD_SCIM_TOKEN_AUTHENTIK

webui:
  redirect_uri: http://localhost:8080/callback
  post_logout_uri: http://localhost:8080/

log:
  level: debug
  format: text
