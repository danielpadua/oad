name: SCIM Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  scim-integration:
    name: SCIM Provisioning Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Configure environment variables
        run: |
          cp deployments/multi-idp/.env.example deployments/multi-idp/.env
          # Generate necessary tokens
          sed -i "s|AUTHENTIK_SECRET_KEY=|AUTHENTIK_SECRET_KEY=$(openssl rand -base64 60 | tr -d '\n')|" deployments/multi-idp/.env
          sed -i "s|AUTHENTIK_OAD_SCIM_TOKEN=|AUTHENTIK_OAD_SCIM_TOKEN=ci-test-token-1234|" deployments/multi-idp/.env
          sed -i "s|OAD_SCIM_TOKEN_AUTHENTIK=|OAD_SCIM_TOKEN_AUTHENTIK=ci-test-token-1234|" deployments/multi-idp/.env

      - name: Start the multi-idp stack
        run: |
          docker compose -f deployments/multi-idp/docker-compose.yml up -d --build

      - name: Wait for scim-sync-init to complete
        run: |
          echo "Waiting for scim-sync-init container to complete..."
          # Follow the init container logs and wait for it to exit
          timeout 300 docker compose -f deployments/multi-idp/docker-compose.yml logs -f scim-sync-init &
          LOG_PID=$!

          # Poll until the container exits
          for i in {1..60}; do
            STATUS=$(docker compose -f deployments/multi-idp/docker-compose.yml ps scim-sync-init --format '{{.State}}' 2>/dev/null || echo "unknown")
            if [ "$STATUS" = "exited" ]; then
              EXIT_CODE=$(docker compose -f deployments/multi-idp/docker-compose.yml ps scim-sync-init --format '{{.ExitCode}}' 2>/dev/null || echo "1")
              kill $LOG_PID 2>/dev/null || true
              if [ "$EXIT_CODE" = "0" ]; then
                echo "scim-sync-init completed successfully!"
                break
              else
                echo "scim-sync-init failed with exit code $EXIT_CODE"
                exit 1
              fi
            fi
            sleep 5
          done

      - name: Run SCIM Integration Assertion
        run: go run scripts/assert_scim_ingest.go
        env:
          DATABASE_URL: postgresql://oad:oad@localhost:5432/oad?sslmode=disable

      - name: Dump logs on failure
        if: failure()
        run: |
          echo "=== scim-sync-init logs ==="
          docker compose -f deployments/multi-idp/docker-compose.yml logs scim-sync-init
          echo ""
          echo "=== api logs ==="
          docker compose -f deployments/multi-idp/docker-compose.yml logs api
          echo ""
          echo "=== authentik-worker logs ==="
          docker compose -f deployments/multi-idp/docker-compose.yml logs authentik-worker
